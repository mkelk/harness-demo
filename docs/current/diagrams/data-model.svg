<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" role="img" aria-labelledby="data-model-title data-model-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="data-model-title">Data model: the tasks table, the lists table and the migration ledger</title>
  <desc id="data-model-desc">The tasks table holds id, title, notes, done_at, created_at, updated_at, from migration 0002 due_on (a calendar date or null) and priority (1 high, 2 normal, 3 low, default 2), and from migration 0003 list_id referencing lists with on delete set null. The lists table holds id, a unique name of 1 to 60 characters and created_at; one list has many tasks. schema_migrations records each applied migration by version, name and time. Indexes: tasks_open_idx on done_at and created_at, tasks_due_idx on done_at, due_on and priority, tasks_list_idx on list_id.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="52" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Data model</text>
  <text x="40" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MIGRATIONS 0001, 0002, 0003 · ONE SQLITE FILE</text>
<rect x="40" y="110" width="520" height="206" rx="6" fill="#f5f5f5"/>
<rect x="40" y="110" width="520" height="206" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
<rect x="48" y="116" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="68" y="125" fill="#eb6c36" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
<text x="96" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">tasks</text>
<line x1="40" y1="138" x2="560" y2="138" stroke="#eb6c36" stroke-opacity="0.25" stroke-width="0.8"/>
<text x="52" y="152" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"># id</text>
<text x="190" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INTEGER</text>
<text x="260" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">PK AUTOINCREMENT</text>
<text x="52" y="170" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">title</text>
<text x="190" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="260" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NOT NULL, length 1..200</text>
<text x="52" y="188" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">notes</text>
<text x="190" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="260" y="188" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NOT NULL DEFAULT '', length &lt;= 2000</text>
<text x="52" y="206" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">done_at</text>
<text x="190" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="260" y="206" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NULL when open, ISO 8601 UTC when done</text>
<text x="52" y="224" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">created_at</text>
<text x="190" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="260" y="224" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ISO 8601 UTC</text>
<text x="52" y="242" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">updated_at</text>
<text x="190" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="260" y="242" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NOT NULL, set on every write</text>
<text x="52" y="260" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">due_on</text>
<text x="190" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="260" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NULL when undated, else YYYY-MM-DD (0002)</text>
<text x="52" y="278" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">priority</text>
<text x="190" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INTEGER</text>
<text x="260" y="278" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NOT NULL DEFAULT 2: 1 High, 2 Normal, 3 Low (0002)</text>
<text x="52" y="296" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">→ list_id</text>
<text x="190" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INTEGER</text>
<text x="260" y="296" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NULL or lists.id, ON DELETE SET NULL (0003)</text>
<text x="52" y="330" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INDEXES tasks_open_idx (done_at, created_at DESC) · tasks_due_idx (done_at, due_on, priority)</text>
<text x="52" y="336" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">tasks_list_idx (list_id)</text>
<rect x="620" y="110" width="300" height="98" rx="6" fill="#f5f5f5"/>
<rect x="620" y="110" width="300" height="98" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="1"/>
<rect x="628" y="116" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="648" y="125" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
<text x="676" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">lists</text>
<line x1="620" y1="138" x2="920" y2="138" stroke="#2d3142" stroke-opacity="0.25" stroke-width="0.8"/>
<text x="632" y="152" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"># id</text>
<text x="770" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INTEGER</text>
<text x="840" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">PK AUTOINCREMENT</text>
<text x="632" y="170" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">name</text>
<text x="770" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="840" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">UNIQUE, length 1..60</text>
<text x="632" y="188" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">created_at</text>
<text x="770" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="840" y="188" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ISO 8601 UTC</text>
<path d="M 560,292 H 612" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M 560,292 H 604 Q 612,292 612,284 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="564" y="270" width="34" height="12" rx="2" fill="#f5f5f5"/><text x="581" y="279" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N → 1</text>
<rect x="620" y="248" width="300" height="98" rx="6" fill="#f5f5f5"/>
<rect x="620" y="248" width="300" height="98" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="1"/>
<rect x="628" y="254" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="648" y="263" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
<text x="676" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">schema_migrations</text>
<line x1="620" y1="276" x2="920" y2="276" stroke="#2d3142" stroke-opacity="0.25" stroke-width="0.8"/>
<text x="632" y="290" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"># version</text>
<text x="770" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INTEGER</text>
<text x="840" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">PK</text>
<text x="632" y="308" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">name</text>
<text x="770" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="840" y="308" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">NOT NULL</text>
<text x="632" y="326" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">applied_at</text>
<text x="770" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TEXT</text>
<text x="840" y="326" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ISO 8601 UTC</text>
<text x="632" y="360" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LEDGER: 1 tasks · 2 task_schedule · 3 lists</text>
  <line x1="30" y1="432" x2="930" y2="432" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="30" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="110" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"># PRIMARY KEY   → FOREIGN KEY (a list has many tasks; deleting it unlists them)</text>
  <rect x="520" y="441" width="30" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
  <text x="558" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OPEN ORDER: due_on ASC (undated last), priority, created_at DESC</text>
</svg>
