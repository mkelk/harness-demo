<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" role="img" aria-labelledby="persistence-title persistence-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="persistence-title">Persistence: how a database handle is made</title>
  <desc id="persistence-desc">Two callers reach openDatabase: getDb, the app's once-per-process handle at the path from readEnv, and createTestDb, once per test at a temp file whose close removes the temp directory. openDatabase creates the parent directory, sets PRAGMA journal_mode WAL and foreign_keys ON, then runs applyMigrations. For each migration, if its version is already in schema_migrations it is skipped; otherwise it runs inside a transaction: BEGIN, the SQL, an insert into the ledger, COMMIT, with ROLLBACK on error. Either way the DatabaseSync handle is returned.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
