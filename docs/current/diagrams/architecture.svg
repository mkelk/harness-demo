<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="architecture-title architecture-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="architecture-title">harness-demo architecture: the request path and the guards around it</title>
  <desc id="architecture-desc">A browser sends page requests and server actions to src/app, the App Router layer. src/app makes typed calls into src/lib, the focal layer that owns the domain rules and persistence. src/lib writes to one SQLite file, data/dev.db, through node:sqlite, and reads the environment once through src/lib/env.ts. Below the code, a zone labelled around the code holds the guards: Playwright e2e drives the browser on port 3100, Vitest verifies src/lib with unit, component and integration tiers, and pnpm docs:check checks docs/current.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- title -->
  <text x="40" y="52" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">harness-demo architecture</text>
  <text x="40" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ONE REQUEST PATH, ONE FILE, THREE GUARDS</text>

  <!-- zone: around the code -->
  <rect x="24" y="360" width="912" height="104" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="36" y="364" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="84" y="373" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AROUND THE CODE</text>

  <!-- arrows (drawn before boxes) -->
  <!-- browser -> app -->
  <line x1="200" y1="170" x2="240" y2="170" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="204" y="148" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="220" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>
  <!-- app -> lib -->
  <line x1="440" y1="170" x2="500" y2="170" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="450" y="148" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="470" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>
  <!-- lib -> db -->
  <line x1="700" y1="170" x2="760" y2="170" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="708" y="148" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="730" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQLITE</text>
  <!-- lib -> env (dashed L path: down from lib bottom at x=520, left into env right edge) -->
  <path d="M 520,200 V 272 Q 520,280 512,280 H 440" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="452" y="258" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="474" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
  <!-- playwright -> browser (dashed vertical) -->
  <line x1="150" y1="392" x2="150" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="158" y="290" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="162" y="299" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DRIVES</text>
  <!-- vitest -> lib (dashed vertical) -->
  <line x1="600" y1="392" x2="600" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="608" y="290" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="612" y="299" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">VERIFIES</text>
  <!-- docs:check -> docs/current (dashed vertical) -->
  <line x1="830" y1="392" x2="830" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="838" y="338" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="842" y="347" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHECKS</text>

  <!-- node: Browser (input) -->
  <rect x="40" y="140" width="160" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="140" width="160" height="60" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="146" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="62" y="155" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="120" y="175" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
  <text x="120" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pages + forms</text>

  <!-- node: src/app (backend) -->
  <rect x="240" y="140" width="200" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="240" y="140" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="248" y="146" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="262" y="155" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
  <text x="340" y="175" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">src/app</text>
  <text x="340" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routes + server actions</text>

  <!-- node: src/lib (focal) -->
  <rect x="500" y="140" width="200" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="140" width="200" height="60" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
  <rect x="508" y="146" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="522" y="155" fill="#eb6c36" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
  <text x="600" y="175" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">src/lib</text>
  <text x="600" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules + persistence</text>

  <!-- node: data/dev.db (store) -->
  <rect x="760" y="140" width="160" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="760" y="140" width="160" height="60" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="768" y="146" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="782" y="155" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
  <text x="840" y="175" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">data/dev.db</text>
  <text x="840" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one SQLite file</text>

  <!-- node: env (optional) -->
  <rect x="240" y="260" width="200" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="240" y="260" width="200" height="40" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">src/lib/env.ts</text>
  <text x="340" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DATABASE_PATH, read once</text>

  <!-- node: docs/current (external) -->
  <rect x="760" y="260" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="760" y="260" width="160" height="40" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <text x="840" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">docs/current</text>
  <text x="840" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">living documentation</text>

  <!-- guards -->
  <rect x="40" y="392" width="220" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="392" width="220" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="150" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Playwright e2e</text>
  <text x="150" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">next dev :3100, data/e2e.db</text>

  <rect x="480" y="392" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="480" y="392" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vitest</text>
  <text x="600" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unit, component, integration</text>

  <rect x="740" y="392" width="180" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="740" y="392" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="830" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pnpm docs:check</text>
  <text x="830" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shape + diagram stamps</text>

  <!-- legend -->
  <line x1="30" y1="512" x2="930" y2="512" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="30" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="110" y1="526" x2="140" y2="526" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="148" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HTTP</text>
  <line x1="200" y1="526" x2="230" y2="526" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="238" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">IN-PROCESS CALL</text>
  <line x1="350" y1="526" x2="380" y2="526" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="388" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">VERIFIES / READS</text>
  <rect x="510" y="520" width="30" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
  <text x="548" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">THE LAYER THAT OWNS THE RULES</text>
</svg>
