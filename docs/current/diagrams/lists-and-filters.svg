<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 740" role="img" aria-labelledby="lists-and-filters-title lists-and-filters-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lists-and-filters-title">Lists and filters: one page body, scoped or not</title>
  <desc id="lists-and-filters-desc">A request to / or /lists/id carries show and q. The page parses them with parseFilterQuery; on /lists/id it also parses the id and loads the list with getList, answering 404 when it is unknown. Both pages render TaskPage, the focal component, which calls listLists for the sidebar and listTasks with the list scope for the sections. The sidebar, ListsNav, shows All tasks and one link per list with its open count, plus the New list form that posts to createListAction; a duplicate name answers with a message. The body shows the heading, the add form with the List select defaulting to the current list, the filter bar and the task sections; on a list page a Delete list button posts to deleteListAction, which sets the tasks' list_id to null through on delete set null and redirects to /.</desc>
