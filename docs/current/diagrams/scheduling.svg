<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" role="img" aria-labelledby="scheduling-title scheduling-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="scheduling-title">Scheduling: how due dates and priority order the list</title>
  <desc id="scheduling-desc">A request to the list page carries show and q query parameters. page.tsx awaits them, computes today as the UTC calendar date, and calls listTasks with the filter. The open list is ordered in three steps: earliest due date first with undated tasks last, then priority high, normal, low, then newest first. Rows render a High or Low badge, the due date, and Overdue when the task is open and its due date is before today. The filter bar's links keep q and its search form keeps show, and each leads back to a new request.</desc>
