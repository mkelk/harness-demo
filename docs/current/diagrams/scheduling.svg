<text x="720.0" y="114.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FilterBar</text>
<text x="720.0" y="129.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">links keep q; the search form keeps show</text>
<rect x="40" y="200" width="320" height="60" rx="6" fill="#f5f5f5"/>
