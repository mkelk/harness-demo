<text x="200.0" y="482.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TaskList</text>
<text x="200.0" y="497.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">badge High / Low · Due YYYY-MM-DD</text>
<text x="200.0" y="510.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Overdue: open and dueOn &lt; today</text>
