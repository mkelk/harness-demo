<text x="64.0" y="215" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
<text x="200.0" y="229.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">page.tsx</text>
<text x="200.0" y="244.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">await searchParams; today = toISOString().slice(0, 10)</text>
<rect x="40" y="320" width="320" height="60" rx="6" fill="#f5f5f5"/>
<rect x="40" y="320" width="320" height="60" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
<rect x="48" y="326" width="22" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="59.0" y="335" fill="#eb6c36" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
<text x="200.0" y="349.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">listTasks(getDb(), { show, q })</text>
<text x="200.0" y="364.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">q: lower(title) LIKE %word%; src/lib/tasks/repository.ts</text>
<rect x="520" y="330" width="400" height="40" rx="6" fill="#f5f5f5"/>
<rect x="520" y="330" width="400" height="40" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="1"/>
<rect x="528" y="336" width="17" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="536.5" y="345" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
