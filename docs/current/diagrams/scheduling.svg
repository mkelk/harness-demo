<text x="200.0" y="114.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/ ?show=open|done|all &amp;q=word</text>
<text x="200.0" y="129.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">show missing: both sections, Done only if non-empty</text>
<rect x="520" y="90" width="400" height="50" rx="6" fill="#f5f5f5"/>
<rect x="520" y="90" width="400" height="50" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
<rect x="528" y="96" width="22" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
