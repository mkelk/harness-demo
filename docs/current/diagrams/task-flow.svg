<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" role="img" aria-labelledby="task-flow-title task-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="task-flow-title">Task flow: from a form to a row and back to the page</title>
  <desc id="task-flow-desc">Three forms post FormData to three server actions. AddTaskForm posts to addTask and EditTaskForm posts to saveTask; both go through parseTaskInput, the focal step, which either returns errors with the submitted values so the form re-renders, or hands a valid TaskInput to the repository (createTask or updateTask). The row forms in TaskList post to toggleTask or removeTask, which call setDone or deleteTask directly. Every write ends with revalidatePath('/'), after which page.tsx re-runs listTasks; saveTask additionally redirects to /. addTask returns ok with a nonce so the add form resets.</desc>
